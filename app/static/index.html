<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlloyPilot · 智能体工作台</title><link rel="stylesheet" href="/static/style.css"></head><body><header><strong>◈ AlloyPilot</strong><span>材料设计智能体工作台</span><button id="model-settings">模型设置</button><button id="new">新建对话</button></header><main><section class="chat"><div id="messages" aria-live="polite"><article><h1>从一个材料设计任务开始</h1><p>描述目标，我会检索智能体能力，提供候选工作流，等待你确认后逐步执行。</p></article></div><form id="composer"><div class="entry"><textarea id="prompt" required maxlength="6000" placeholder="例如：为新能源汽车防撞梁设计铝合金，优先考虑强度与轻量化"></textarea><button id="send">生成方案 ↑</button></div><small id="status">确认工作流后才会调用插件执行</small></form></section><aside><h2>可用 Skill 插件</h2><p>每次任务均检索全部智能体介绍</p><div id="skills"></div></aside></main><dialog id="model-dialog"><form id="model-form"><h2>模型设置</h2><p>支持 OpenAI 兼容接口，基础地址通常以 /v1 结尾。</p><label>Base URL<input id="model-url" type="url" placeholder="https://api.example.com/v1" required></label><label>API Key<input id="model-key" type="password" autocomplete="new-password" placeholder="输入 API Key"></label><label>Model name<input id="model-name" required placeholder="服务商提供的模型名称"></label><p>密钥留空时保留已保存的密钥。测试会发送一条简短请求。</p><p id="model-feedback" role="status"></p><div class="model-actions"><button type="button" id="model-close">关闭</button><button type="button" id="model-test">测试连通性</button><button id="model-save" type="submit">保存并应用</button></div></form></dialog><script src="/static/app.js"></script></body></html>
